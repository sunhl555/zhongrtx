<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中瑞天禧酒店 · 旅拍助手</title>
<style>
:root{--gold:#d4a853;--goldd:#b8903a;--bg:#f5f0e8;--card:#fff;--txt:#333;--t2:#888;--bd:#e0d8cc;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
.hidden{display:none!important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.btn{padding:10px 22px;border-radius:22px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--goldd)}
.btn-outline{background:#fff;color:var(--gold);border:1.5px solid var(--gold)}
.btn-outline:hover{background:#fdf8f0}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:#e74c3c;color:#fff}.btn-danger:hover{background:#c0392b}
.btn-gray{background:#eee;color:#666}.btn-gray:hover{background:#ddd}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:16px}
.btn-green{background:#0fa87e;color:#fff}.btn-green:active{background:#0b8a68}

/* ===== GUEST MODE ===== */
.guest-page{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.guest-top{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;text-align:center;padding:24px 20px}
.guest-top .hn{font-size:13px;opacity:.7;letter-spacing:3px;margin-bottom:4px}
.guest-top h2{font-size:22px;font-weight:700}
.guest-body{padding:20px}

/* Template selector */
.tpl-selector{margin-bottom:20px}
.tpl-selector h3{font-size:14px;color:var(--t2);margin-bottom:10px;letter-spacing:1px}
.tpl-cards{display:flex;flex-direction:column;gap:10px}
.tpl-card{background:#fdf8f0;border:2px solid transparent;border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.2s}
.tpl-card:hover{border-color:var(--gold)}
.tpl-card.active{border-color:var(--gold);background:#fff;box-shadow:0 2px 12px rgba(212,168,83,.2)}
.tpl-card .tpl-name{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:4px}
.tpl-card .tpl-preview{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* Template detail */
.tpl-detail .imgs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding-bottom:4px}
.tpl-detail .imgs .img-wrap{position:relative;flex-shrink:0;scroll-snap-align:center}
.tpl-detail .imgs img{width:calc(100vw - 80px);max-width:380px;height:240px;object-fit:cover;border-radius:10px;display:block}
.img-save-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
.img-save-btn:active{background:rgba(0,0,0,.8)}

/* Image viewer */
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column}
.img-viewer img{max-width:95vw;max-height:70vh;object-fit:contain;border-radius:8px}
.img-viewer .close{position:absolute;top:16px;right:16px;color:#fff;font-size:28px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.img-viewer .save-big{background:var(--gold);color:#fff;border:none;padding:12px 30px;border-radius:22px;font-size:16px;margin-top:16px;cursor:pointer}
.tpl-detail .d-title{font-size:20px;font-weight:700;margin-bottom:10px;line-height:1.4}
.tpl-detail .d-body{font-size:15px;line-height:1.9;color:#444;white-space:pre-wrap;margin-bottom:14px}
.tpl-detail .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tpl-detail .d-tag{font-size:11px;background:#fdf8f0;color:#b8903a;padding:3px 10px;border-radius:12px}
.guest-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.steps{background:#f8f6f2;border-radius:var(--r);padding:18px;margin-bottom:20px}
.steps h4{font-size:13px;color:var(--t2);margin-bottom:10px}
.steps .st{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;color:#555}
.steps .sn{width:22px;height:22px;background:var(--gold);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.guest-footer{text-align:center;padding:16px;color:#ccc;font-size:11px}

/* No templates */
.no-tpl{text-align:center;padding:60px 20px;color:#ccc}
.no-tpl .icon{font-size:48px;margin-bottom:12px}

/* ===== ADMIN MODE ===== */
.admin-header{background:#fff;border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.admin-header h1{font-size:17px;font-weight:600}
.admin-header .badge{font-size:10px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px}
.admin-container{max-width:1100px;margin:0 auto;padding:16px}
.admin-split{display:flex;gap:16px;min-height:calc(100vh - 84px)}
.admin-sidebar{width:220px;flex-shrink:0;background:var(--card);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.06);padding:12px 0}
.admin-sidebar h3{font-size:12px;color:var(--t2);padding:0 14px;margin-bottom:8px;letter-spacing:2px}
.admin-sidebar .tpl-item{padding:8px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent;display:flex;align-items:center;justify-content:space-between}
.admin-sidebar .tpl-item:hover{background:#fdf8f0}
.admin-sidebar .tpl-item.sel{background:#fdf8f0;border-left-color:var(--gold);font-weight:600;color:var(--gold)}
.admin-sidebar .tpl-item .del{opacity:0;font-size:12px;color:#999;cursor:pointer;padding:2px 6px}
.admin-sidebar .tpl-item:hover .del{opacity:1}
.admin-main{flex:1;background:var(--card);border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.06);padding:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px;letter-spacing:1px}
.form-group input,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--gold)}
.form-group textarea{min-height:110px;line-height:1.7}
.img-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.img-card{width:100px;height:100px;border-radius:8px;background:#f9f7f3;border:1.5px dashed var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.img-card:hover{border-color:var(--gold)}
.img-card.add{font-size:28px;color:#ccc}
.img-card img{width:100%;height:100%;object-fit:cover}
.img-card .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.export-box{border-top:1px solid var(--bd);margin-top:20px;padding-top:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.export-box .info{flex:1;min-width:200px}
.export-box .info h4{font-size:15px;margin-bottom:6px}
.export-box .info p{font-size:12px;color:var(--t2);line-height:1.6}
.auth-box{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.auth-card{background:#fff;border-radius:var(--r);padding:28px;width:300px;text-align:center}
.auth-card h3{margin-bottom:14px}
.auth-card input{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;text-align:center;margin-bottom:10px}
.auth-card input:focus{outline:none;border-color:var(--gold)}

@media(max-width:768px){
  .admin-split{flex-direction:column}
  .admin-sidebar{width:100%;display:flex;overflow-x:auto;padding:8px;gap:6px}
  .admin-sidebar h3{display:none}
  .admin-sidebar .tpl-item{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .admin-sidebar .tpl-item.sel{border-left:none;border-bottom-color:var(--gold)}
  .admin-main{padding:16px}
}
</style>
</head>
<body>

</div>

<script>
// ============ DATA LAYER ============
function loadTemplates(){
  try{
    var el=document.getElementById('tpl-data');
    var raw=el.textContent.trim();
    if(raw) return JSON.parse(raw);
  }catch(e){console.error('解析模板数据失败',e)}
  return [];
}
function saveTemplates(templates){
  var el=document.getElementById('tpl-data');
  el.textContent=JSON.stringify(templates);
}

var TEMPLATES=loadTemplates();
var SETTINGS={password:'888888',baseUrl:''};
try{
  var s=localStorage.getItem('tps_settings');
  if(s) SETTINGS=JSON.parse(s);
}catch(e){}

// ============ TOAST ============
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000);
}

// ============ MODE DETECTION ============
(function(){
  var params=new URLSearchParams(location.search);
  if(params.get('admin')!==null||location.hash==='#admin'){
    showAdminAuth();
  }else{
    showGuestMode();
  }
})();

// ============ GUEST MODE ============
function showGuestMode(){
  document.getElementById('guestMode').classList.remove('hidden');
  document.getElementById('adminMode').classList.add('hidden');
  document.getElementById('authBox').classList.add('hidden');
  renderGuestPage();
}

function renderGuestPage(){
  var tpls=TEMPLATES;
  var container=document.getElementById('guestBody');

  if(tpls.length===0){
    container.innerHTML='<div class="no-tpl"><div class="icon">📝</div><p>暂无分享模板</p><p style="font-size:12px;color:#ccc">请联系酒店前台</p></div>';
    return;
  }

  var html='';

  // If only one template, skip selector
  if(tpls.length===1){
    html+=renderTplDetail(tpls[0]);
  }else{
    html+='<div class="tpl-selector"><h3>📋 选择一条您喜欢的分享内容</h3><div class="tpl-cards">';
    for(var i=0;i<tpls.length;i++){
      html+='<div class="tpl-card'+(i===0?' active':'')+'" onclick="selectTpl('+i+')" id="tplCard'+i+'">';
      html+='<div class="tpl-name">'+(i+1)+'. '+escHtml(tpls[i].title)+'</div>';
      html+='<div class="tpl-preview">'+escHtml(tpls[i].body.split('\n')[0])+'</div>';
      html+='</div>';
    }
    html+='</div></div><div id="tplDetail">'+renderTplDetail(tpls[0])+'</div>';
  }

  container.innerHTML=html;
}

function renderTplDetail(tpl){
  var imgs='';
  var hasImages=tpl.images&&tpl.images.length>0;
  if(hasImages){
    for(var i=0;i<tpl.images.length;i++){
      imgs+='<div class="img-wrap"><img src="'+tpl.images[i]+'" alt="" onclick="viewImage(\''+tpl.id+'\','+i+')"><button class="img-save-btn" onclick="guestSaveImage(\''+tpl.id+'\','+i+')">💾 保存</button></div>';
    }
  }else{
    imgs='<div style="width:100%;height:180px;background:#f5f0e8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:14px">暂无图片 · 请联系酒店更新</div>';
  }

  var tags='';
  if(tpl.tags&&tpl.tags.length>0){
    for(var i=0;i<tpl.tags.length;i++){
      tags+='<span class="d-tag">#'+escHtml(tpl.tags[i])+'</span>';
    }
  }

  var saveAllBtn='';
  if(hasImages&&tpl.images.length>1){
    saveAllBtn='<button class="btn btn-outline btn-full" onclick="guestSaveAll(\''+tpl.id+'\')">📥 一键保存全部图片（'+tpl.images.length+'张）</button>';
  }

  return '<div class="tpl-detail">'
    +'<div class="imgs">'+imgs+'</div>'
    +'<div class="d-title">'+escHtml(tpl.body.split('\n')[0])+'</div>'
    +'<div class="d-body">'+escHtml(tpl.body)+'</div>'
    +'<div class="d-tags">'+tags+'</div>'
    +'<div class="guest-actions">'
    +'<button class="btn btn-gold btn-full" onclick="guestCopy(\''+tpl.id+'\')">📋 一键复制文案</button>'
    +saveAllBtn
    +'<button class="btn btn-green btn-full" onclick="guestOpenCtrip()">📱 打开携程发旅拍</button>'
    +'</div>'
    +'<div class="steps"><h4>📝 发布步骤（30秒搞定）</h4>'
    +'<div class="st"><span class="sn">1</span>点「一键复制文案」</div>'
    +'<div class="st"><span class="sn">2</span>点每张图下的「保存」按钮存到相册</div>'
    +'<div class="st"><span class="sn">3</span>点「打开携程发旅拍」</div>'
    +'<div class="st"><span class="sn">4</span>粘贴文案 + 上传刚保存的图片 + 发布</div>'
    +'</div>';
}

function selectTpl(idx){
  var cards=document.querySelectorAll('.tpl-card');
  for(var i=0;i<cards.length;i++){cards[i].classList.remove('active')}
  var card=document.getElementById('tplCard'+idx);
  if(card) card.classList.add('active');
  document.getElementById('tplDetail').innerHTML=renderTplDetail(TEMPLATES[idx]);
}

function guestCopy(tplId){
  var tpl=null;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===tplId){tpl=TEMPLATES[i];break}}
  if(!tpl){toast('内容未找到');return}
  var text=tpl.body;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){toast('✅ 文案已复制！去携程粘贴吧')}).catch(function(){fallbackCopy(text)});
  }else{fallbackCopy(text)}
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('✅ 文案已复制！去携程粘贴吧')}catch(e){toast('复制失败，请手动选择文字复制')}
  document.body.removeChild(ta);
}

function guestOpenCtrip(){
  var start=Date.now();
  var iframe=document.createElement('iframe');iframe.style.display='none';iframe.src='ctrip://';
  document.body.appendChild(iframe);
  setTimeout(function(){
    document.body.removeChild(iframe);
    if(Date.now()-start<2500) window.location.href='https://you.ctrip.com/travels/';
  },2000);
  setTimeout(function(){window.location.href='ctrip://'},100);
}

// ============ IMAGE SAVE ============
function guestSaveImage(tplId,idx){
  var tpl=null;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===tplId){tpl=TEMPLATES[i];break}}
  if(!tpl||!tpl.images||!tpl.images[idx]) return;
  var dataUrl=tpl.images[idx];
  // Try download approach
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download='中瑞天禧酒店_'+(idx+1)+'.jpg';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('📥 图片保存中…如未自动下载，请长按图片选择保存');
}

function guestSaveAll(tplId){
  var tpl=null;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===tplId){tpl=TEMPLATES[i];break}}
  if(!tpl||!tpl.images||tpl.images.length===0) return;
  toast('📥 正在保存'+tpl.images.length+'张图片…');
  for(var i=0;i<tpl.images.length;i++){
    setTimeout((function(idx){
      return function(){
        var a=document.createElement('a');
        a.href=tpl.images[idx];
        a.download='中瑞天禧酒店_'+(idx+1)+'.jpg';
        a.style.display='none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
    })(i), i*300);
  }
  setTimeout(function(){toast('✅ 全部图片保存请求已发送，请查看相册/下载目录')},tpl.images.length*300+500);
}

function viewImage(tplId,idx){
  var tpl=null;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===tplId){tpl=TEMPLATES[i];break}}
  if(!tpl||!tpl.images||!tpl.images[idx]) return;
  var dataUrl=tpl.images[idx];
  var viewer=document.createElement('div');
  viewer.className='img-viewer';
  viewer.innerHTML='<span class="close" onclick="this.parentElement.remove()">✕</span><img src="'+dataUrl+'" alt=""><button class="save-big" onclick="guestSaveImage(\''+tplId+'\','+idx+');this.parentElement.remove()">💾 保存到手机</button>';
  viewer.onclick=function(e){if(e.target===viewer) viewer.remove()};
  document.body.appendChild(viewer);
}

// ============ ADMIN AUTH ============
function showAdminAuth(){
  document.getElementById('guestMode').classList.add('hidden');
  document.getElementById('adminMode').classList.add('hidden');
  document.getElementById('authBox').classList.remove('hidden');
  document.getElementById('pwdInput').focus();
}

function doLogin(){
  var input=document.getElementById('pwdInput').value.trim();
  if(input===SETTINGS.password){
    document.getElementById('authBox').classList.add('hidden');
    showAdminMode();
  }else{
    toast('密码错误');
    document.getElementById('pwdInput').value='';
    document.getElementById('pwdInput').focus();
  }
}

function adminLogout(){
  document.getElementById('adminMode').classList.add('hidden');
  showAdminAuth();
}

// ============ ADMIN MODE ============
var activeTplId=null;

function showAdminMode(){
  document.getElementById('adminMode').classList.remove('hidden');
  document.getElementById('guestMode').classList.add('hidden');
  renderSidebar();
  if(TEMPLATES.length>0&&!activeTplId) openEditor(TEMPLATES[0].id);
}

function renderSidebar(){
  var list=document.getElementById('tplList');
  var html='';
  for(var i=0;i<TEMPLATES.length;i++){
    var t=TEMPLATES[i];
    html+='<div class="tpl-item'+(t.id===activeTplId?' sel':'')+'" onclick="openEditor(\''+t.id+'\')">';
    html+='<span>'+escHtml(t.title||'未命名')+'</span>';
    html+='<span class="del" onclick="event.stopPropagation();deleteTpl(\''+t.id+'\')">✕</span>';
    html+='</div>';
  }
  if(TEMPLATES.length===0) html='<p style="color:#ccc;font-size:12px;padding:14px;text-align:center">暂无模板<br>点击下方新建</p>';
  list.innerHTML=html;
}

function newTemplate(){
  var tpl={id:'t'+Date.now(),title:'新建模板',hotelName:'中瑞天禧酒店',body:'',tags:[],images:[]};
  TEMPLATES.push(tpl);
  saveTemplates(TEMPLATES);
  activeTplId=tpl.id;
  renderSidebar();
  renderEditor(tpl);
  toast('✅ 新模板已创建');
}

function openEditor(id){
  activeTplId=id;
  renderSidebar();
  var tpl=null;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===id){tpl=TEMPLATES[i];break}}
  if(tpl) renderEditor(tpl);
}

function deleteTpl(id){
  if(!confirm('确定删除这个模板吗？')) return;
  var newList=[];
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id!==id) newList.push(TEMPLATES[i])}
  TEMPLATES=newList;
  saveTemplates(TEMPLATES);
  activeTplId=TEMPLATES.length>0?TEMPLATES[0].id:null;
  renderSidebar();
  if(activeTplId) openEditor(activeTplId);
  else document.getElementById('adminMain').innerHTML='<p style="color:#ccc;text-align:center;padding:60px 0">← 新建一个模板开始吧</p>';
}

function renderEditor(tpl){
  var tagsStr=tpl.tags?tpl.tags.join(','):'';
  var imgsHtml='';
  if(tpl.images){
    for(var i=0;i<tpl.images.length;i++){
      imgsHtml+='<div class="img-card"><img src="'+tpl.images[i]+'" alt=""><span class="rm" onclick="removeImg(\''+tpl.id+'\','+i+')">✕</span></div>';
    }
  }
  imgsHtml+='<div class="img-card add" onclick="addImages(\''+tpl.id+'\')">+</div>';

  var main=document.getElementById('adminMain');
  main.innerHTML=''
    +'<div class="form-group"><label>模板名称（在模板列表中显示）</label><input type="text" id="eTitle" value="'+escHtml(tpl.title||'')+'"></div>'
    +'<div class="form-group"><label>文案内容（客人将一键复制这段文字）</label><textarea id="eBody">'+escHtml(tpl.body||'')+'</textarea></div>'
    +'<div class="form-group"><label>标签（逗号分隔）</label><input type="text" id="eTags" value="'+escHtml(tagsStr)+'" placeholder="凯里酒店,村T,贵州旅游"></div>'
    +'<div class="form-group"><label>图片（客人可长按保存，建议3-6张，每张≤500KB）</label><div class="img-grid" id="imgGrid">'+imgsHtml+'</div></div>'
    +'<div style="display:flex;gap:8px;margin-bottom:16px">'
    +'<button class="btn btn-gold" onclick="saveTpl(\''+tpl.id+'\')">💾 保存</button>'
    +'<button class="btn btn-gray" onclick="openEditor(\''+tpl.id+'\')">↺ 放弃</button>'
    +'</div>'
    +'<div class="export-box">'
    +'<div class="info"><h4>📥 导出并发布</h4><p>保存修改后点导出，下载一个全新的HTML文件。<br>上传到 GitHub 即可更新客人扫码看到的页面。</p></div>'
    +'<button class="btn btn-gold" onclick="doExport()">📥 导出 HTML</button>'
    +'</div>';
}

function saveTpl(id){
  for(var i=0;i<TEMPLATES.length;i++){
    if(TEMPLATES[i].id===id){
      TEMPLATES[i].title=document.getElementById('eTitle').value.trim()||'未命名';
      TEMPLATES[i].body=document.getElementById('eBody').value;
      var ts=document.getElementById('eTags').value.trim();
      TEMPLATES[i].tags=ts?ts.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean):[];
      saveTemplates(TEMPLATES);
      renderSidebar();
      toast('✅ 模板已保存');
      return;
    }
  }
}

function addImages(tplId){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=function(){
    var files=Array.from(inp.files);if(files.length===0) return;
    var tpl=null;
    for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===tplId){tpl=TEMPLATES[i];break}}
    if(!tpl) return;
    var loaded=0;
    files.forEach(function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var dataUrl=e.target.result;
          if(file.size>500*1024||img.width>1200){
            var canvas=document.createElement('canvas');
            var scale=Math.min(1,1200/img.width);
            canvas.width=img.width*scale;canvas.height=img.height*scale;
            var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
            dataUrl=canvas.toDataURL('image/jpeg',0.8);
          }
          tpl.images.push(dataUrl);
          saveTemplates(TEMPLATES);
          renderEditor(tpl);
          toast('✅ 图片已添加');
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    });
  };
  inp.click();
}

function removeImg(tplId,idx){
  for(var i=0;i<TEMPLATES.length;i++){
    if(TEMPLATES[i].id===tplId){
      TEMPLATES[i].images.splice(idx,1);
      saveTemplates(TEMPLATES);
      renderEditor(TEMPLATES[i]);
      return;
    }
  }
}

// ============ EXPORT ============
function doExport(){
  if(!activeTplId){toast('请先选择一个模板');return}
  saveTpl(activeTplId);

  // Update template data in the script tag
  saveTemplates(TEMPLATES);

  // Serialize the entire HTML
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;

  // Download
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='index.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✅ 已导出 index.html！上传到 GitHub 即可更新');
}

// ============ PREVIEW ============
function previewGuest(){
  if(!activeTplId){toast('请先选择一个模板');return}
  saveTpl(activeTplId);
  // Save current state then switch to guest mode preview
  saveTemplates(TEMPLATES);
  var params=new URLSearchParams(location.search);
  var url=location.origin+location.pathname;
  window.open(url,'_blank');
}

// ============ UTILS ============
function escHtml(str){
  var d=document.createElement('div');d.textContent=str;return d.innerHTML;
}
